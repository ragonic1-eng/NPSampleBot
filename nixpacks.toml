# Railway / nixpacks build config.
#
# tesseract-ocr: shells out from pytesseract at runtime so /scan can OCR
# product labels without the (paid) Claude Haiku vision fallback.
#
# Chromium system libs: pulled in for Playwright (awb_sync.py twice-
# daily DHL + FedEx scrape). Headless Chromium needs nss/atk/cups/
# xrandr/gbm/pango/cairo/asound + a font package or it segfaults on
# launch. fonts-liberation is the smallest font set that DHL/FedEx
# don't render as boxes.
#
# opencv (pulled in by RapidOCR, the primary OCR engine) links against a
# handful of X11/GL shared libraries that the slim Railway image doesn't
# ship. Missing ANY one makes `import cv2` raise ImportError, RapidOCR then
# silently drops out, and scans fall back to the weak Tesseract path. We hit
# them one at a time across deploys (first libGL, then libxcb.so.1), so this
# is now the COMPLETE documented set for opencv-python on headless Debian —
# libgl1, glib, libsm6, libxext6, libxrender1, libxcb1, libxi6, libxrandr2,
# libxfixes3 — to end the whack-a-mole. (libxcb.so.1 → libxcb1 was the one
# that surfaced in a live /scan diag on V1.17.6.)
[phases.setup]
aptPkgs = [
    "tesseract-ocr",
    # --- opencv (RapidOCR) runtime deps: complete X11/GL set ---
    "libgl1",
    "libglib2.0-0",
    "libsm6",
    "libxext6",
    "libxrender1",
    "libxcb1",
    "libxi6",
    "libxrandr2",
    "libxfixes3",
    # onnxruntime (RapidOCR's inference backend) links OpenMP.
    "libgomp1",
    # --- chromium runtime deps ---
    "libnss3",
    "libnspr4",
    "libatk1.0-0",
    "libatk-bridge2.0-0",
    "libcups2",
    "libxcomposite1",
    "libxdamage1",
    "libxrandr2",
    "libgbm1",
    "libxkbcommon0",
    "libpango-1.0-0",
    "libpangocairo-1.0-0",
    "libcairo2",
    "libasound2",
    "fonts-liberation",
]

# After pip install we still need to fetch the Chromium binary itself
# — pip only installs the python bindings. Skip the system-deps step
# (we handle those above) so this stays fast on rebuilds.
#
# We ALSO warm the RapidOCR model cache at BUILD time. RapidOCR downloads
# ~20 MB of ONNX models on first use; if that first use is a rep's scan on a
# container with slow/absent outbound network, init fails or times out and
# the bot silently drops to Tesseract. `python warm_ocr_models.py` forces the
# download now, into the image, so the first real scan is instant and can't
# fail on a network hiccup. It's best-effort (`|| true`) so a transient
# registry outage never breaks the whole deploy.
[phases.build]
cmds = [
    "python -m playwright install chromium",
    # RapidOCR pulls the DESKTOP opencv-python, which links X11/GL libs the
    # slim server image lacks — the root cause of the recurring
    # "libGL.so.1 / libxcb.so.1 not found" RapidOCR failures. opencv-python-
    # headless is the same library built WITHOUT any GUI/X11 dependency,
    # made for headless servers exactly like Railway. Swap to it once, and
    # the whole class of missing-.so errors disappears. Clean uninstall of
    # every opencv variant first (they share the cv2/ dir, so a partial mix
    # is worse than none), then install headless only; warm_ocr_models.py
    # right after both fetches the models AND verifies cv2 imports cleanly.
    "pip uninstall -y opencv-python opencv-contrib-python opencv-python-headless opencv-contrib-python-headless || true",
    "pip install opencv-python-headless",
    "python warm_ocr_models.py || true",
]
